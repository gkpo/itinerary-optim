name: Déployer la webapp sur GitHub Pages

# Deux mécanismes, pour fonctionner quelle que soit la source choisie dans Settings → Pages :
#  - "Deploy from a branch" (gh-pages, /) : le job publish-branch pousse webapp/ sur gh-pages ;
#  - "GitHub Actions" : le job deploy-actions déploie webapp/ directement.
on:
  push:
    branches: [main, claude/paris-bike-routes-gentle-slopes-2m4xmk]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que la page assemblée est complète
        run: |
          test -f webapp/index.html -a -f webapp/data.js -a -f webapp/basemap.webp -a -f webapp/leaflet.js
          grep -q "ROUTE_DATA" webapp/data.js
          touch webapp/.nojekyll
      - name: Pousser webapp/ sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Webapp ${{ github.sha }}"

  deploy-actions:
    runs-on: ubuntu-latest
    continue-on-error: true   # échoue sans bloquer si la source Pages est la branche gh-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
