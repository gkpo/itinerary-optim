name: Déployer la webapp sur GitHub Pages

# Publie le contenu de webapp/ sur la branche gh-pages ; GitHub Pages sert cette branche
# (Settings → Pages → Source : "Deploy from a branch", gh-pages, /).
on:
  push:
    branches: [main, claude/paris-bike-routes-gentle-slopes-2m4xmk]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que la page assemblée est complète
        run: |
          test -f webapp/index.html -a -f webapp/data.js -a -f webapp/basemap.webp -a -f webapp/leaflet.js
          grep -q "ROUTE_DATA" webapp/data.js
          touch webapp/.nojekyll
      - name: Pousser webapp/ sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Webapp ${{ github.sha }}"
